apiVersion: v1
kind: ConfigMap
metadata: {name: app-config}
data: {PORT: "8000", LOG_LEVEL: INFO, ENVIRONMENT: kubernetes}
---
apiVersion: v1
kind: Secret
metadata: {name: app-secrets}
type: Opaque
stringData: {PLACEHOLDER: "replace-at-deploy-with-external-secret"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: devops-app}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: devops-app}}
  template:
    metadata: {labels: {app: devops-app}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: app
        image: ghcr.io/OWNER/REPO:TAG
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: app-config}}]
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
        resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: devops-app}
spec:
  selector: {app: devops-app}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: devops-app}
spec:
  ingressClassName: nginx
  rules:
  - host: devops.local
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: devops-app, port: {number: 80}}}}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: devops-app}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: devops-app}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
