global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: app
    metrics_path: /metrics
    static_configs: [{targets: ["app:8000"]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: cadvisor
    static_configs: [{targets: [cadvisor:8080]}]
