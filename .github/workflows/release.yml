name: Release and deploy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  publish:
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: tags
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.DEPLOY_INSTANCE_ID != '' && vars.GHCR_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through SSM and verify with rollback
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          # Reuse the publish job's lowercased image reference; GHCR tags are always lowercase.
          IMAGE: ${{ needs.publish.outputs.image }}:sha-${{ github.sha }}
          GHCR_USER: ${{ vars.GHCR_USERNAME }}
        run: |
          ping_status=Unknown
          echo "Waiting for EC2 instance $INSTANCE_ID to register with Systems Manager in $AWS_REGION..."
          for _ in $(seq 1 30); do
            ping_status=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo Unknown)
            if [[ "$ping_status" == Online ]]; then break; fi
            sleep 10
          done
          if [[ "$ping_status" != Online ]]; then
            echo "Instance did not become an online SSM managed node (last status: $ping_status). Check that amazon-ssm-agent is running and the instance can reach the regional SSM endpoints over HTTPS."
            exit 1
          fi
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=['/opt/devops/deploy.sh $IMAGE $GHCR_USER']" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command ID: $command_id"
          for _ in $(seq 1 60); do
            state=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$state" in
              Success)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "SSM command $command_id did not finish within ten minutes."
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json || true
          exit 1
